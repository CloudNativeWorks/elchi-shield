# Example policy using the built-in DLP (data-loss prevention) on the RESPONSE
# body. It detects sensitive data and either BLOCKS the message (hard secrets) or
# REDACTS it in place (PII), rewriting the body that Envoy forwards downstream.
# Recommended split: keys/secrets → block; cards/SSNs/emails/JWTs → redact.
#
# DLP requires the response body to be buffered (inspect_response_body), so it
# adds latency/memory to DLP routes — scope it to the routes that need it.
apiVersion: sentinel.elchi.io/v1
kind: SecurityPolicy
metadata:
  name: api-dlp
spec:
  defaults:
    mode: block
    fail_mode: fail_close

  domains:
    - hosts: ["dlp.example.com"]
      routes:
        - match:
            path_prefix: "/"
          policy:
            mode: block
            inspect_response_body: true
            checks:
              body:
                dlp:
                  direction: response          # response (default) | request | both
                  # Hard secrets: a leak is a serious incident → block the response.
                  block: ["private_key", "aws_access_key", "google_api_key", "slack_token", "github_token"]
                  # PII: mask in place so the response is still usable.
                  #   credit_card → keeps the last 4 digits; others → [REDACTED:<kind>].
                  redact: ["credit_card", "ssn", "email", "jwt"]

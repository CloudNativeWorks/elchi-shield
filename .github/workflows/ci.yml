name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.5" # build/test with the patched toolchain (fixes stdlib CVEs, incl. GO-2026-5856 crypto/tls)

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      # Single full binary — every engine (incl. the Coraza WAF) and audit sink is
      # compiled in; there are no build tags.
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
      - name: test -race
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: golangci/golangci-lint-action@v8
        with:
          # golangci-lint v2 (the .golangci.yml uses `version: "2"` and the repo
          # is on go 1.26 — v1 binaries can't load either). Pin to match local.
          version: v2.12.2

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      # Short fuzz smoke on the security-critical parsers/decoders so regressions
      # that crash on adversarial input are caught on every PR.
      - name: fuzz config.Parse
        run: go test ./internal/config/ -run='^$' -fuzz='^FuzzParse$' -fuzztime=30s
      - name: fuzz matchers
        run: |
          go test ./internal/matcher/ -run='^$' -fuzz='^FuzzHostMatch$' -fuzztime=20s
          go test ./internal/matcher/ -run='^$' -fuzz='^FuzzPathMatch$' -fuzztime=20s
      - name: fuzz decode stage
        run: go test ./internal/pipeline/stages/ -run='^$' -fuzz='^FuzzDecodeBody$' -fuzztime=30s

  e2e:
    name: End-to-end (real Envoy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      # func-e fetches/runs a real Envoy; the harness proxies HTTP through
      # elchi-shield and asserts allow(200)/block(403)/rate-limit(429).
      - name: install func-e
        run: go install github.com/tetratelabs/func-e/cmd/func-e@latest
      - name: e2e smoke
        run: PATH="$(go env GOPATH)/bin:$PATH" make e2e

# Comprehensive policy for the end-to-end harness (test/e2e/run.sh). Each route
# exercises a specific capability/field; the harness fires real HTTP through a
# real Envoy and asserts the decision per phase.
apiVersion: sentinel.elchi.io/v1
kind: SecurityPolicy
metadata:
  name: e2e
spec:
  defaults:
    mode: block
    fail_mode: fail_open
    timeout: 500ms
    max_request_body_bytes: 1048576

  # Paths that bypass ALL inspection (checked before policy resolution).
  exclude: ["/exempt"]

  domains:
    # ---- Main hosts: ["unmatched paths fall to this domain default (off → allow). ----"]
    - hosts: ["api.example.com"]
      policy: { mode: off }          # domain default: allow unmatched paths
      routes:
        # Decision modes
        - match: { path_prefix: "/off" }
          policy: { mode: off }
        - match: { path_prefix: "/detect" }
          policy: { mode: detect, checks: { headers: { forbidden: ["X-Debug"] } } }
        - match: { path_prefix: "/shadow" }
          policy: { mode: shadow, checks: { headers: { forbidden: ["X-Debug"] } } }

        # Header checks (fast_pre_checks)
        - match: { path_prefix: "/block-hdr" }
          policy: { mode: block, checks: { headers: { forbidden: ["X-Debug"] } } }
        # /exempt has a blocking route, but the top-level exclude bypasses it.
        - match: { path_prefix: "/exempt" }
          policy: { mode: block, checks: { headers: { forbidden: ["X-Debug"] } } }
        - match: { path_prefix: "/req-hdr" }
          policy: { mode: block, checks: { headers: { required: ["X-Custom-Req"] } } }
        - match: { path_prefix: "/big-hdr" }
          policy: { mode: block, checks: { headers: { max_header_value_bytes: 256 } } }

        # Body checks (body phase)
        - match: { path_prefix: "/json" }
          policy:
            mode: block
            inspect_request_body: true
            checks: { body: { require_json: true } }
        - match: { path_prefix: "/pii" }
          policy:
            mode: block
            inspect_request_body: true
            checks: { body: { detect_sensitive_data: true } }
        - match: { path_prefix: "/small" }
          policy:
            mode: block
            inspect_request_body: true
            max_request_body_bytes: 16     # tiny → over-limit body is truncated → blocked
        - match: { path_prefix: "/gzip" }
          policy:
            mode: block
            inspect_request_body: true
            checks: { body: { require_json: true } }   # gzip is decoded, then JSON-validated

        # Engines
        - match: { path_prefix: "/jwt" }
          policy:
            mode: block
            engines:
              jwt: { algorithms: ["HS256"], hmac_secret: "e2e-secret", audience: "api", required_claims: ["sub"] }
        - match: { path_prefix: "/jwt-iss" }
          policy:
            mode: block
            engines:
              jwt: { algorithms: ["HS256"], hmac_secret: "e2e-secret", audience: "api", issuer: "https://issuer.example.com", required_claims: ["sub"] }
        - match: { path_prefix: "/rl-hdr" }
          policy:
            mode: block
            engines:
              rate_limit: { requests_per_second: 1, burst: 1, key: header, header: "X-Api-Key" }
        - match: { path_prefix: "/rl" }
          policy:
            mode: block
            engines:
              rate_limit: { requests_per_second: 1, burst: 2, key: ip }
        - match: { path_prefix: "/rl-host" }
          policy:
            mode: block
            engines:
              rate_limit: { requests_per_second: 1, burst: 1, key: host }

        # IP reputation (header-phase, source-IP based). The harness sets the
        # source IP via the first X-Forwarded-For token. __CFG__ is replaced by
        # run.sh with the live config dir so the threat-feed file resolves.
        - match: { path_prefix: "/ip-deny" }
          policy: { mode: block, engines: { ip_reputation: { deny_cidrs: ["203.0.113.0/24"] } } }
        - match: { path_prefix: "/ip-allow" }
          policy: { mode: block, engines: { ip_reputation: { allow_cidrs: ["10.0.0.0/8"] } } }
        - match: { path_prefix: "/ip-feed" }
          policy:
            mode: block
            engines:
              ip_reputation:
                feeds:
                  - { name: e2e_threat, file: "__CFG__/threat-feed.txt", format: cidr_lines, severity: high }
        - match: { path_prefix: "/ip-geo" }
          policy:
            mode: block
            engines:
              ip_reputation:
                geoip:
                  database_file: "__CFG__/geo-country.mmdb"
                  block_countries: ["GB"]

        # Bot detection (header-phase, layered scorer). JA3/JA4 arrive as Envoy-
        # supplied headers (x-shield-ja4); the harness sets them directly.
        - match: { path_prefix: "/bot" }
          policy:
            mode: block
            engines:
              bot:
                score_threshold: 100
                user_agent:
                  deny_substrings: ["sqlmap", "nikto", "python-requests", "curl/", "Go-http-client"]
                  block_empty: true
                  score_known_bot: 50
                verified_bots:
                  - { name: googlebot, file: "__CFG__/googlebot.txt", format: cidr_lines, ua_match: "(?i)googlebot" }
                tls_fingerprint:
                  deny_ja4: ["t13d-known-bad-ja4"]
                  tool_ja4: ["t13d-curl-tool-ja4"]
                heuristics:
                  require_accept_language: true
                  score_per_anomaly: 100

        # Collaborative anomaly scoring: the bot engine emits its score instead of
        # blocking; the policy blocks only when the per-request total ≥ threshold.
        - match: { path_prefix: "/anomaly" }
          policy:
            mode: block
            anomaly_threshold: 70
            engines:
              bot:
                emit_score: true
                user_agent: { score_known_bot: 40 }
                heuristics: { require_accept_language: true, score_per_anomaly: 40 }

        # API-key authentication (header-phase).
        - match: { path_prefix: "/apikey" }
          policy:
            mode: block
            engines:
              api_key:
                keys:
                  - { key: "e2e-api-key-1", subject: svc-a, scopes: ["read"] }
                  - { key: "e2e-admin-key", subject: svc-admin, scopes: ["read", "admin"] }
                require_scope_for_path:
                  - { path_prefix: "/apikey/admin", scope: admin }
        # HMAC request signing (native scheme).
        - match: { path_prefix: "/hmac" }
          policy:
            mode: block
            engines:
              hmac_sign:
                secret: "e2e-hmac-secret-0123456789abcdef"
                window: 300s
        # RFC 9421 HTTP Message Signatures.
        - match: { path_prefix: "/sig" }
          policy:
            mode: block
            engines:
              http_signature:
                secret: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
                covered_components: ["@method", "@authority", "@path"]
        # JWT validation via a local JWKS file (RS256). __CFG__ → live config dir.
        - match: { path_prefix: "/jwks" }
          policy:
            mode: block
            engines:
              jwks:
                file: "__CFG__/jwks.keyset"
                algorithms: ["RS256"]
                audience: "api"
                required_claims: ["sub"]
        # mTLS client-cert identity via the forwarded XFCC header. In production
        # Envoy sets x-forwarded-client-cert from the verified peer cert; on this
        # plaintext e2e listener Envoy would strip that header, so the harness
        # injects the same XFCC-format value via a custom header name.
        - match: { path_prefix: "/xfcc" }
          policy:
            mode: block
            engines:
              xfcc:
                header_name: "x-test-client-cert"
                require_present: true
                uris: ["spiffe://cluster/ns/team/sa/web"]
                dns_names: ["client.example.com"]
        # OpenAPI positive validation.
        - match: { path_prefix: "/oas" }
          policy:
            mode: block
            engines:
              openapi:
                spec_file: "__CFG__/api-spec.oas"
                validate_request_body: true
                reject_undeclared_path: true
        # GraphQL guard (body-phase): depth/alias/root-field/batch/introspection.
        - match: { path_prefix: "/graphql" }
          policy:
            mode: block
            engines:
              graphql:
                max_depth: 4
                max_aliases: 3
                max_root_fields: 5
                max_operations: 2
                block_introspection: true
        - match: { path_prefix: "/waf" }
          policy:
            mode: block
            inspect_request_body: true
            engines:
              coraza:
                directives: |
                  SecRuleEngine On
                  SecRequestBodyAccess On
                  SecRule REQUEST_HEADERS:Content-Type "@rx ^" "id:1000,phase:1,pass,nolog,ctl:forceRequestBodyVariable=On"
                  SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(sqlmap|nikto|nmap|masscan|acunetix)" "id:1001,phase:1,deny,status:403,log,msg:'scanner'"
                  SecRule REQUEST_BODY "@rx (?i)union\s+select" "id:1002,phase:2,deny,status:403,log,msg:'sqli-union'"
                  SecRule REQUEST_BODY "@rx (?i)\bor\b\s+1\s*=\s*1" "id:1003,phase:2,deny,status:403,log,msg:'sqli-or'"
                  SecRule REQUEST_BODY "@rx (?i)<script" "id:1004,phase:2,deny,status:403,log,msg:'xss'"
                  SecRule REQUEST_BODY "@rx (?:;|\||&&|\$\()\s*(?:cat|ls|wget|curl|nc|bash|sh)\b" "id:1005,phase:2,deny,status:403,log,msg:'cmdi'"
                  SecRule REQUEST_BODY "@rx \.\./" "id:1006,phase:2,deny,status:403,log,msg:'traversal'"
        # WAF in DetectionOnly: rules match but never interrupt → request allowed.
        - match: { path_prefix: "/waf-detect" }
          policy:
            mode: block
            inspect_request_body: true
            engines:
              coraza:
                directives: |
                  SecRuleEngine DetectionOnly
                  SecRequestBodyAccess On
                  SecRule REQUEST_HEADERS:Content-Type "@rx ^" "id:1010,phase:1,pass,nolog,ctl:forceRequestBodyVariable=On"
                  SecRule REQUEST_BODY "@rx (?i)union\s+select" "id:1011,phase:2,deny,status:403,log,msg:'sqli'"
        # WAF forcing a status code (418) that is NOT in Envoy's StatusCode enum,
        # to check shield clamps/handles it rather than emitting a bad ImmediateResponse.
        - match: { path_prefix: "/waf-418" }
          policy:
            mode: block
            engines:
              coraza:
                directives: |
                  SecRuleEngine On
                  SecRule REQUEST_URI "@contains /waf-418" "id:1030,phase:1,deny,status:418,log,msg:'teapot'"
        # WAF on the RESPONSE body (phase:4) — blocks a leaked marker from upstream.
        - match: { path_prefix: "/waf-resp" }
          policy:
            mode: block
            inspect_response_body: true
            engines:
              coraza:
                directives: |
                  SecRuleEngine On
                  SecResponseBodyAccess On
                  SecResponseBodyMimeType text/plain text/html application/json
                  SecRule RESPONSE_BODY "@rx CORAZA_RESP_HIT" "id:1020,phase:4,deny,status:403,log,msg:'resp-leak'"

        # Routing: method + content-type predicates (non-match falls to domain default off)
        - match: { path_prefix: "/method", methods: [POST] }
          policy: { mode: block, checks: { headers: { forbidden: ["X-Debug"] } } }
        - match: { path_prefix: "/ct", content_type: ["application/json"] }
          policy: { mode: block, inspect_request_body: true, checks: { body: { require_json: true } } }

        # Path precedence: exact "/p/health" (off) beats prefix "/p/" (block)
        - match: { path_exact: "/p/health" }
          policy: { mode: off }
        - match: { path_prefix: "/p/" }
          policy: { mode: block, checks: { headers: { forbidden: ["X-Debug"] } } }

        # skip_checks: the forbidden-header check is configured but skipped, so the
        # otherwise-blocked X-Debug header passes.
        - match: { path_prefix: "/skip" }
          policy:
            mode: block
            skip_checks: ["forbidden_headers"]
            checks: { headers: { forbidden: ["X-Debug"] } }

        # Response inspection
        - match: { path_prefix: "/resp" }
          policy:
            mode: block
            inspect_response_body: true
            checks: { body: { require_json: true } }
        - match: { path_prefix: "/resp-pii" }
          policy:
            mode: block
            inspect_response_body: true
            checks: { body: { detect_sensitive_data: true } }
        # DLP: redact PII / block hard secrets in the response body.
        # No inspect_response_body here: it is auto-derived from dlp.direction=response.
        - match: { path_prefix: "/dlp" }
          policy:
            mode: block
            checks:
              body:
                dlp:
                  direction: response
                  block: ["private_key", "aws_access_key"]
                  redact: ["credit_card", "email", "ssn", "jwt"]

        # ============ Advanced field coverage ============

        # Coraza with the EMBEDDED OWASP CRS (not custom directives) + rule exclusion.
        - match: { path_prefix: "/waf-crs" }
          policy:
            mode: block
            inspect_request_body: true
            engines:
              # Embedded OWASP CRS. The response transaction now runs CRS phase-1 init,
              # so a benign echo response no longer false-positives on outbound 959100.
              coraza: { include_owasp: true, paranoia_level: 1 }

        # API key from the QUERY string, custom param name, sha256-at-rest key.
        # sha256("qkey-secret-1") = af0e29456f322e606885cd1e7f16eb3964c2f3f534bd8bbf4c5330a953a6c720
        - match: { path_prefix: "/apikey-q" }
          policy:
            mode: block
            engines:
              api_key:
                source: query
                name: "api_key"
                keys:
                  - { sha256: "af0e29456f322e606885cd1e7f16eb3964c2f3f534bd8bbf4c5330a953a6c720", subject: q-user, scopes: ["read"] }

        # DLP on the REQUEST body (redact PII before upstream, block hard secrets).
        # No inspect_request_body here: auto-derived from dlp.direction=request.
        - match: { path_prefix: "/dlp-req" }
          policy:
            mode: block
            checks:
              body:
                dlp: { direction: request, block: ["private_key"], redact: ["credit_card", "email"] }

        # DLP in DETECT mode: observe-only — must record the would-redaction but NOT
        # rewrite the body (proves detect/shadow never mutate traffic).
        - match: { path_prefix: "/dlp-detect" }
          policy:
            mode: detect
            checks:
              body:
                dlp: { direction: response, redact: ["email"] }

        # Bot: require_accept + require_accept_encoding heuristics; JA3 deny; JA4 score.
        - match: { path_prefix: "/bot2" }
          policy:
            mode: block
            engines:
              bot:
                score_threshold: 50
                tls_fingerprint:
                  ja3_header: "x-shield-ja3"
                  deny_ja3: ["ja3-known-bad"]
                  ja4_header: "x-shield-ja4"
                  score_ja4: { "t13d-suspect-ja4": 60 }
                heuristics: { require_accept: true, require_accept_encoding: true, score_per_anomaly: 30 }

        # HMAC: sha512 + key-id rotation (secrets map) + required body digest.
        - match: { path_prefix: "/hmac2" }
          policy:
            mode: block
            inspect_request_body: true
            engines:
              hmac_sign:
                secrets: { "2024": "old-secret-key-2024xx", "2025": "new-secret-key-2025xx" }
                key_id_header: "X-Key-Id"
                algorithm: sha512
                window: 300s
                require_body_digest: true

        # GraphQL: whole-document field budget + fragment-depth bound.
        - match: { path_prefix: "/graphql2" }
          policy:
            mode: block
            engines:
              graphql: { content_types: ["application/json"], paths: ["/graphql2"], max_total_fields: 5, max_fragment_depth: 3 }

        # JWT: custom header name + clock-skew leeway (accept a just-expired token).
        - match: { path_prefix: "/jwt-lw" }
          policy:
            mode: block
            engines:
              jwt: { algorithms: ["HS256"], hmac_secret: "e2e-secret", audience: "api", header_name: "X-Access-Token", leeway: 120s }

        # IP reputation: allow_countries (default-deny others) + firehol_netset feed.
        - match: { path_prefix: "/ip-geo-allow" }
          policy:
            mode: block
            engines:
              ip_reputation: { geoip: { database_file: "__CFG__/geo-country.mmdb", allow_countries: ["SE"] } }
        - match: { path_prefix: "/ip-feed-fh" }
          policy:
            mode: block
            engines:
              ip_reputation:
                feeds:
                  - { name: fh, file: "__CFG__/feed-firehol.netset", format: firehol_netset, severity: high }

        # Match by path_regex (only digit segments hit the block policy).
        - match: { path_regex: "^/re/[0-9]+$" }
          policy: { mode: block, checks: { headers: { forbidden: ["X-Debug"] } } }

        # Match by request header value (HeaderMatch exact) in addition to the path.
        - match: { path_prefix: "/hm", headers: [ { name: "X-Env", exact: "prod" } ] }
          policy: { mode: block, checks: { headers: { forbidden: ["X-Debug"] } } }

        # XFCC by subject DN and by cert fingerprint (hash), not just SPIFFE/DNS.
        - match: { path_prefix: "/xfcc2" }
          policy:
            mode: block
            engines:
              xfcc:
                header_name: "x-test-client-cert"
                require_present: true
                subjects: ["CN=web,OU=team"]
                hashes: ["abc123def456"]

    # ---- A different exact hosts: ["monitor only (off) → proves host-specific routing. ----"]
    - hosts: ["other.example.com"]
      policy: { mode: off }

    # ---- Wildcard hosts: ["blocks X-Debug (exact api.example.com still beats it). ----"]
    - hosts: ["*.example.com"]
      policy: { mode: block, checks: { headers: { forbidden: ["X-Debug"] } } }
